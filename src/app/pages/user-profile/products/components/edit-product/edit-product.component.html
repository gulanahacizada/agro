<div class="account-body bg-white shadow-big p-40">
  <div class="pb-20 mb-40 border-bottom clear">
    <h3 class="bold m-0 text-main text-uppercase float-left mt-3 mb-3"> Düzəliş et</h3>
    <div class="clear float-right">
      <a [routerLink]="[ '/dashboard/products' ]" class="btn bg-white border-0 shadow-big radius-20 float-left"
        title="Geri">
        <i aria-hidden="true" class="icon-arrow-left v-align-middle"></i>
        <span class="hide-xs v-align-middle ml-10">Geri</span>
      </a>
      <ul class="form-lang type-none mb-0 p-0 clear float-left" role="tablist">
        <li role="presentation" class="float-left ml-10" (click)="onChangeLanguage('az',1)">
          <span role="button" class="btn circle border-0 shadow-big bg-green">AZ</span>
        </li>
        <li role="presentation" class="float-left ml-10" (click)="onChangeLanguage('en',2)">
          <span role="button" class="btn circle border-0 shadow-big">EN</span>
        </li>
        <li role="presentation" class="float-left ml-10" (click)="onChangeLanguage('ru',3)">
          <span role="button" class="btn circle border-0 shadow-big">RU</span>
        </li>
      </ul>
    </div>
  </div>
  <form [formGroup]="productEditForm" (ngSubmit)='updateProduct()'>
    <div class="row as-10">
      <div class="col as-3 md-4 sm-6 mb-20">
        <label for="prod_name" class="pl-10">Kategoriya</label>
        <p-dropdown placeholder="{{productResponse?.name.parent.name_az}}" [options]="categoryList"
          (onChange)="onSelectCategory($event)" placeholder="Kategoriya seçin" filter="true"
          class="input custom select border-0 radius-20 shadow-big">
        </p-dropdown>
      </div>
      <div class="col as-3 md-4 sm-6 mb-20">
        <label for="prod_name" class="pl-10">Məhsul</label>
        <p-dropdown formControlName='category_id' [options]="productList" (onChange)="onSelectProduct($event)"
          placeholder="{{productResponse?.name.name_az}}" filter="true"
          class="input custom select border-0 radius-20 shadow-big">
        </p-dropdown>
      </div>
      <div class="col as-3 md-4 sm-6 mb-20">
        <label for="prod_name" class="pl-10">Növ</label>
        <p-dropdown formControlName='kind_id' filter="true" [options]="kindList"
          placeholder="{{productResponse?.kind.name_az}}" class="input custom select border-0 radius-20 shadow-big">
        </p-dropdown>
      </div>
      <div class="col as-3 md-4 sm-6 mb-20">
        <label for="prod_name" class="pl-10">Keyfiyyət</label>
        <p-dropdown formControlName="quality_id" [options]="qualityList"
          placeholder="{{productResponse?.quality.name_az}}" filter="true"
          class="input custom select border-0 radius-20 shadow-big">
        </p-dropdown>
      </div>
      <div class="col as-3 md-4 sm-6 mb-20">
        <label for="prod_name" class="pl-10">Qablaşdırma</label>
        <p-dropdown formControlName="package_id" [options]="packegeList"
          placeholder="{{productResponse?.package.name_az}}" filter="true"
          class="input custom select border-0 radius-20 shadow-big">
        </p-dropdown>
      </div>
      <div class="col as-3 md-4 sm-6 mb-20">
        <label for="prod_name" class="pl-10"> Məhsulun kalibri</label>
        <p-dropdown formControlName="kalibry_id" [options]="kalibryList"
          placeholder="{{productResponse?.kolibry.name_az}}" filter="true"
          class="input custom select border-0 radius-20 shadow-big">
        </p-dropdown>
      </div>

      <div class="col as-3 md-4 sm-6 mb-20">
        <label for="prod_name" class="pl-10">Ölçü vahidi</label>
        <p-dropdown formControlName="unit_id" [options]="unitList" placeholder="{{productResponse?.unit.name_az}}"
          filter="true" class="input custom select border-0 radius-20 shadow-big">
        </p-dropdown>
      </div>
      <div class="col as-3 md-4 sm-6 xs-12 mb-20 pb-10">
        <label for="" class="pl-10">Miqdar (kg)</label>
        <input formControlName="common" type="number" min="0" max="" id="" class="input border-0 radius-20 shadow-big">
      </div>
      <div class="col as-3 md-4 sm-6 xs-12 mb-20 pb-10">
        <label for="" class="pl-10"> Məhsulun qiyməti (1 kg) </label>
        <input formControlName="price" type="number" min="0" max="" id="" class="input border-0 radius-20 shadow-big">
      </div>
      <div class="col as-3 md-4 sm-6 xs-12 mb-20 pb-10">
        <label for="" class="pl-10">Yıgılma tarixi</label>
        <p-calendar formControlName="accumulated_at" class="input custom border-0 radius-20 shadow-big"
          placeholder="../../...." name="preparingDate" dateFormat="yy-mm-dd" [dataType]="'string'">
        </p-calendar>
      </div>
      <div class="col as-3 md-4 sm-6 xs-12 mb-20 pb-10">
        <label for="" class="pl-10">Saxlanma müddəti</label>
        <p-calendar formControlName="expiry_time" class="input custom border-0 radius-20 shadow-big"
          placeholder="../../...." name="preparingDate" dateFormat="yy-mm-dd" [dataType]="'string'">
        </p-calendar>
      </div>
      <div class="col as-12 mb-20 pb-10">
        <label for="description" class="pl-10">Məhsul haqqında</label>
        <div [ngSwitch]="selectLang">
          <div *ngSwitchCase="1">
            <textarea formControlName="description_az" name id="description" cols="30" rows="10"
              class="input no-resize border-0 radius-20 shadow-big" placeholder="Ətraflı məlumat qeyd edin">
                         </textarea>
          </div>
          <div *ngSwitchCase="2">
            <textarea formControlName="description_en" name id="description" cols="30" rows="10"
              class="input no-resize border-0 radius-20 shadow-big" placeholder="Ətraflı məlumat qeyd edin">
                         </textarea>
          </div>
          <div *ngSwitchCase="3">
            <textarea formControlName="description_ru" name id="description" cols="30" rows="10"
              class="input no-resize border-0 radius-20 shadow-big" placeholder="Ətraflı məlumat qeyd edin">
                         </textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="clear radius-30 shadow-big p-5 mt-20">
      <button type="submit" class="btn lg bg-green border-0 radius-30 shadow-big float-right">
        Yadda saxla
      </button>
    </div>
  </form>
</div>

<div class="panel relative shadow-big">
  <div class="container as-10 xl-15 lg-15">
    <div class="panel-header pl-0 pr-0">
      <nav aria-label="Breadcrumb navbar">
        <ol class="breadcrumb" aria-label="Breadcrumb" itemscope itemtype="https://schema.org/BreadcrumbList">
          <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <a [routerLink]="['/']" title="AgroBirja.az - Ana səhifə" itemprop="item">
              <span itemprop="name">AgroBirja.az</span>
            </a>
            <meta itemprop="position" content="1">
          </li>
          <li aria-current="page" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <span title="Aqronomlar" itemprop="item" itemscope itemtype="https://schema.org/Thing" id="/agronomists">
              <span itemprop="name">Aqronomlar</span>
            </span>
            <meta itemprop="position" content="2">
          </li>
        </ol>
      </nav>
    </div>
    <div class="panel-header pl-0 pr-0 border-0">
      <h1 class="m-0 bold text-main text-uppercase">
        Aqronomlar
      </h1>
    </div>
  </div>
</div>
<div class="container as-10 xl-15 lg-15 pt-30 pb-30">
  <div class="row as-15 sm-5 xs-5">
    <div *ngFor="let agronom of agronomList; trackBy: agronomService.trackByFn" [routerLink]="[ 'detail', agronom?.id ]"
      class="col xl-3 lg-4 md-6 sm-6 xs-12 mb-30">
      <div class="item bg-white shadow-big h-100p">
        <div class="thumb scale responsive pb-in-80 border-bottom">
          <img src="{{agronom?.image}}" alt="Aqronomist name" width="300" height="240">
        </div>

        <div class="p-15 pb-10 text-center text-uppercase">
          <a title="Aqronomist name" class="d-block">
            <span class="title font-16 text-main bold line-clamp line-1"><u>{{agronom?.title}}</u></span>
            <small class="type text-gray mt-3">{{ agronom?.description}}</small>
          </a>
          <div class="border-top pt-10 mt-10 text-center">
            <a title="Facebook" rel="external noopener noreferrer" data-toggle="tooltip"
              class="social-link btn xs circle bg-fb border-0 shadow-big ml-2 mr-2">
              <i aria-hidden="true" class="icon-social-facebook v-align-middle"></i>
            </a>
            <a title="Twitter" rel="external noopener noreferrer" data-toggle="tooltip"
              class="social-link btn xs circle bg-tw border-0 shadow-big ml-2 mr-2">
              <i aria-hidden="true" class="icon-social-twitter v-align-middle"></i>
            </a>
            <a title="Linkedin" rel="external noopener noreferrer" data-toggle="tooltip"
              class="social-link btn xs circle bg-ln border-0 shadow-big ml-2 mr-2">
              <i aria-hidden="true" class="icon-social-linkedin v-align-middle"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="panel-footer">
    <p-paginator *ngIf="agronomList?.length" [rows]="pagination?.per_page" [totalRecords]="pagination?.total"
      (onPageChange)="paginate($event)"></p-paginator>
  </div>
</div>

<div class="panel relative shadow-big">
  <div class="container as-10 xl-15 lg-15">
    <div class="panel-header pl-0 pr-0">
      <nav aria-label="Breadcrumb navbar">
        <ol class="breadcrumb" aria-label="Breadcrumb" itemscope itemtype="https://schema.org/BreadcrumbList">
          <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <a [routerLink]="['/']" title="AgroBirja.az - Ana səhifə" itemprop="item">
              <span itemprop="name">AgroBirja.az</span>
            </a>
            <meta itemprop="position" content="1">
          </li>
          <li aria-current="page" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <span title="Xəbərlər" itemprop="item" itemscope itemtype="https://schema.org/Thing" id="/news">
              <span itemprop="name">Xəbərlər</span>
            </span>
            <meta itemprop="position" content="2">
          </li>
        </ol>
      </nav>
    </div>
    <div class="panel-header pl-0 pr-0 border-0">
      <h1 class="m-0 bold text-main text-uppercase">
        Xəbərlər
      </h1>
    </div>
  </div>
</div>
<div class="container as-10 xl-15 lg-15 pt-30 pb-30">
  <div class="row as-15 sm-5 xs-5">
    <div *ngFor="let news of newsList; trackBy: newsService.trackByFn" class="col as-4 md-6 sm-6 xs-12 mb-30">
      <div class="item news-item bg-white shadow-big h-100p">
        <a [routerLink]="[ 'detail', news?.id ]" title="Title" class="d-block clear">
          <div class="thumb hover scale responsive pb-in-65">
            <img data-src="{{news?.image}}" alt="title" width="" height="">
          </div>
          <div class="info tr-3s border-top">
            <div class="clear mb-10">
              <span class="date-time d-in-block text-gray light">
                <i aria-hidden="true" class="icon-calendar-8 text-special mr-10"></i>
                {{news?.created_at |  date}}
              </span>
            </div>
            <span class="title font-16 text-main bold line-clamp line-1"><u>{{news?.title}}</u></span>
          </div>
        </a>
      </div>
    </div>
  </div>
  <div class="panel-footer">
    <p-paginator *ngIf="newsList?.length" [rows]="pagination?.per_page" [totalRecords]="pagination?.total"
      (onPageChange)="paginate($event)"></p-paginator>
  </div>
</div>

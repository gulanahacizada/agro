<div class="container as-10 xl-15 lg-15 pt-20">
  <div class="row as-10 xl-15 lg-15">
    <div class="col as-12 lg-9 mb-20">
      <article class="article panel shadow-big">
        <div class="panel-header">
          <nav aria-label="Breadcrumb navbar">
            <ol class="breadcrumb" aria-label="Breadcrumb" itemscope itemtype="https://schema.org/BreadcrumbList">
              <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                <a [routerLink]="['/']" title="AgroBirja.az - Ana səhifə" itemprop="item">
                  <span itemprop="name">AgroBirja.az</span>
                </a>
                <meta itemprop="position" content="1">
              </li>
              <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                <a [routerLink]="['/news']" title="Xəbərlər" itemprop="item">
                  <span itemprop="name">{{'navigation.news' | translate}}</span>
                </a>
                <meta itemprop="position" content="2">
              </li>
              <li aria-current="page" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                <span title="News title" itemprop="item" itemscope itemtype="https://schema.org/Thing"
                  id="/news/news-title">
                  <span itemprop="name">{{title}}</span>
                </span>
                <meta itemprop="position" content="34">
              </li>
            </ol>
          </nav>
        </div>
        <header class="panel-header p-40 pt-20 pb-20">
          <h1 class="article-title bold m-0">{{title}} </h1>
        </header>
        <aside class="article-side panel-header p-10 pl-40 pr-40">
          <div class="row as-10">
            <div class="col xs-12 d-flex-center">
              <div class="clear">
                <time datetime="2019-08-25T15:50" class="date bold text-main mr-20 pr-10">
                  <i aria-hidden="true" class="icon-calendar-8 mr-10"></i>{{newInfo?.created_at | date: 'dd/MM/yyyy'}}
                </time>
                <span class="views-count text-main">
                  <i aria-hidden="true" class="icon-eye mr-10"></i> {{newInfo?.views}}
                </span>
              </div>
            </div>
          </div>
        </aside>
        <figure class="thumb responsive pb-in-56 m-0">
          <img src={{newInfo?.image}} alt="title" width="960" height="960">
        </figure>
        <div class="article-body panel-body p-40 font-16 light">
          <p class="description font-18 bold">{{description}}</p>
          <div [innerHTML]="this.body"></div>
        </div>
      </article>
    </div>
    <div class="col as-12 xl-3 mb-20" >
      <div class="row as-10">
        <div class="col xl-12 lg-4 md-6 sm-6 xs-12 mb-20" *ngFor="let news of newsList; trackBy: newsService.trackByFn">
          <div (click)="test(news.id)" class="item news-item bg-white">
            <a [routerLink]="[ '/news/detail', news?.id ]" title="Title" class="d-block clear">
              <div class="thumb hover scale responsive pb-in-65">
                <img  alt="title" class="loaded"
                data-src="{{news?.image}}"  data-was-processed="true">
              </div>
              <div class="info tr-3s border-top">

                <span class="title text-black font-16 bold line-clamp line-3 mb-10">{{news?.title}} </span>

                <span class="date-time text-gray light">
                  <i aria-hidden="true" class="icon-calendar-8 text-special mr-10"></i>
                  {{news?.created_at |  date}}
                </span>

              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
